<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictado y Voz</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      background: #f4f7f6;
      text-align: center;
    }
    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      font-size: 16px;
      border: 2px solid #ddd;
      border-radius: 12px;
      resize: none;
      box-sizing: border-box;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background: #007AFF;
      color: white;
      transition: background 0.3s;
    }
    button:active { transform: scale(0.98); }
    #status {
      margin-top: 15px;
      font-size: 14px;
      color: #666;
    }
    .listening { background: #FF3B30 !important; }
  </style>
</head>
<body>

  <h2>🎙️ Dictado a Voz</h2>

  <textarea id="input-area" placeholder="Tu dictado aparecerá aquí..."></textarea>

  <button id="btn-action" onclick="startProcess()">🎤 Empezar a Escuchar</button>

  <div id="status">Presiona el botón para hablar</div>

  <script>
    // --- CONFIGURACIÓN POR OMISIÓN ---
    const DEFAULT_RATE = 1.5;  // Velocidad (0.5 a 2)
    const DEFAULT_PITCH = 2.0; // Tono (0 a 2)
    const LANG = 'es-ES';      // Idioma

    const synth = window.speechSynthesis;
    const btn = document.getElementById('btn-action');
    const area = document.getElementById('input-area');
    const status = document.getElementById('status');

    // Configuración de Reconocimiento de Voz (STT)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = LANG;
    recognition.interimResults = false;

    // Al recibir el resultado del dictado
    recognition.onresult = (event) => {
      const text = event.results[0][0].transcript;
      area.value = text;
      status.innerHTML = "✅ Dictado recibido. Reproduciendo...";
      speak(text); // Reproducir automáticamente
    };

    recognition.onend = () => {
      btn.classList.remove('listening');
      btn.innerHTML = "🎤 Empezar a Escuchar";
    };

    function startProcess() {
      if (synth.speaking) synth.cancel(); // Detener si ya está hablando
      try {
        recognition.start();
        btn.classList.add('listening');
        btn.innerHTML = "🛑 Escuchando...";
        status.innerHTML = "Escuchando tu voz...";
      } catch (e) {
        console.log("Ya se está escuchando");
      }
    }

    // Función de Texto a Voz (TTS)
    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = LANG;
      utterance.rate = DEFAULT_RATE;
      utterance.pitch = DEFAULT_PITCH;

      // Intentar forzar una voz en español si está disponible
      const voices = synth.getVoices();
      const spanishVoice = voices.find(v => v.lang.includes('es'));
      if (spanishVoice) utterance.voice = spanishVoice;

      utterance.onend = () => {
        status.innerHTML = "✅ Proceso completado.";
      };

      synth.speak(utterance);
    }

    // Cargar voces al inicio
    speechSynthesis.onvoiceschanged = () => synth.getVoices();
  </script>

</body>
</html>
